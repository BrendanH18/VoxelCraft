[package]
name = "voxelcraft"
default-run = "voxelcraft"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Minecraft-style voxel game written from scratch in Rust, built for performance"
readme = "README.md"
repository = "https://github.com/BrendanH18/VoxelCraft"
keywords = ["voxel", "game", "wgpu", "minecraft", "procedural"]
categories = ["games"]

[[bin]]
name = "voxelcraft"
path = "src/main.rs"
required-features = ["client"]

[[bin]]
name = "voxelcraft-agent"
path = "src/bin/voxelcraft-agent.rs"

[features]
default = ["client"]
client = ["dep:cpal", "dep:dirs", "dep:env_logger", "dep:font8x8", "dep:gilrs", "dep:png", "dep:pollster", "dep:wgpu", "dep:winit"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = { version = "0.18.2", optional = true }
crossbeam-channel = "0.5.17"
dirs = { version = "6.0.0", optional = true }
env_logger = { version = "0.11.11", optional = true }
font8x8 = { version = "0.3.1", default-features = false, optional = true }
gilrs = { version = "0.11.2", optional = true }
glam = "0.33.11"
log = "0.4.34"
png = { version = "0.18.1", optional = true }
pollster = { version = "1.0.1", optional = true }
rustc-hash = "2.1.3"
serde_json = "1.0"
wgpu = { version = "30.0.1", optional = true }
winit = { version = "0.30.13", optional = true }

[dev-dependencies]
# Validates the WGSL shaders in tests (the same version wgpu uses).
naga = { version = "30.0.1", features = ["wgsl-in"] }

[build-dependencies]
winresource = "0.1.31"

# Keep dependencies optimized even in debug builds so the game is playable while iterating.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
