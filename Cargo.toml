[package]
name = "voxelcraft"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Minecraft-style voxel game written from scratch in Rust, built for performance"
readme = "README.md"
keywords = ["voxel", "game", "wgpu", "minecraft", "procedural"]
categories = ["games"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
env_logger = "0.11.11"
font8x8 = { version = "0.3.1", default-features = false }
glam = "0.33.11"
log = "0.4.34"
png = "0.18.1"
pollster = "1.0.1"
rustc-hash = "2.1.3"
wgpu = "30.0.1"
winit = "0.30.13"

# Keep dependencies optimized even in debug builds so the game is playable while iterating.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
