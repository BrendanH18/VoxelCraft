version: 2
updates:
  # Rust crates in Cargo.toml and Cargo.lock. Minor and patch updates arrive as
  # one pull request; major updates come one at a time. The release toolchain
  # pinned in release.yml is updated by hand.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
