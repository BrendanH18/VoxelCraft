name: Probe draft-release tools (temporary)
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 5
    steps:
      - run: |
          gh --version
          sha256sum --version | head -1
          python3 --version
          bash --version | head -1
          GH_TOKEN=${{ github.token }} gh release list -R ${{ github.repository }} --limit 1
