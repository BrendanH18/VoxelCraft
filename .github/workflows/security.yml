name: Security

# Checks Cargo.lock against the RustSec advisory database weekly, because new
# advisories appear without code changes, and on pull requests that change
# dependencies.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
