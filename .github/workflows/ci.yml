name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs run on Namespace runners (https://namespace.so): Linux on the owner's
# `gitrunner` profile (amd64, with a cache volume) and macOS on an inline
# label with a cache volume, which `nscloud-cache-action` fills. Windows
# stays on GitHub's runner because the Namespace plan has no Windows.
# Actions are pinned to full commit SHAs; Dependabot updates them.

jobs:
  fmt:
    name: rustfmt
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain rust-toolchain.toml pins, the one CI, releases and Boat checks share.
      - name: Read the pinned Rust toolchain
        id: rust
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15 (no release tags)
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt
      - run: cargo fmt --check

  ruff:
    name: ruff
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Nothing to cache: Ruff runs through uvx, and the project has no uv lockfile.
          enable-cache: false
      - run: uvx ruff@0.17.5 check
      - run: uvx ruff@0.17.5 format --check

  test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    # Windows on GitHub's runner took 28 to 53 minutes over eight runs to
    # 2026-11-16, most of it building the release tests, and one main run
    # was cancelled at the old 60-minute limit.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            # 16 GB: the release test build outgrew the 4x8 gitrunner profile's
            # 8 GB (rustc was killed on 2026-11-13), so this row names its shape.
            runner: [nscloud-ubuntu-24.04-amd64-8x16-with-cache, nscloud-cache-tag-voxelcraft-ci-linux]
          - os: macos
            runner: [nscloud-macos-tahoe-arm64-6x14-with-cache, nscloud-cache-tag-voxelcraft-ci-macos]
          - os: windows
            # The Namespace plan doesn't allow Windows instances (checked 2026-11-06).
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux audio/windowing headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libfontconfig1-dev libfreetype6-dev pkg-config
      # The toolchain rust-toolchain.toml pins, the one CI, releases and Boat checks share.
      - name: Read the pinned Rust toolchain
        id: rust
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15 (no release tags)
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: clippy
      - if: runner.os != 'Windows'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust
      - if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The `ci` profile is release without cross-crate LTO and with 16 codegen units (Cargo.toml):
      # the same optimisations and assertions, much faster to build and link.
      - run: cargo clippy --profile ci --all-targets --locked -- -D warnings
      - run: cargo test --profile ci --locked
      - name: Headless generation/meshing benchmark
        run: cargo run --profile ci --locked -- --bench --rd 4
      # The binary from the benchmark step checks its embedded asset manifest.
      - name: Validate assets
        if: runner.os == 'Linux'
        run: python3 tools/validate_assets.py --executable target/ci/voxelcraft
      - name: Benchmark gate tool tests
        if: runner.os == 'Linux'
        run: python3 -m unittest tools/test_benchmark_scenes.py
      - name: Documentation links
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest tools/test_check_doc_links.py
          python3 tools/check_doc_links.py
      # Every feature the build-5000 campaign claims is counted once, with evidence.
      - name: Campaign ledger
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest tools/test_campaign_ledger.py
          python3 tools/campaign_ledger.py

  headless:
    name: simulation without client dependencies
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain rust-toolchain.toml pins, the one CI, releases and Boat checks share.
      - name: Read the pinned Rust toolchain
        id: rust
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15 (no release tags)
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: clippy
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust
      - run: cargo clippy --profile ci --no-default-features --all-targets --locked -- -D warnings
      - run: cargo test --profile ci --no-default-features --locked
      - run: cargo run --profile ci --no-default-features --locked --example headless
