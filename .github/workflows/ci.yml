name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs run on Namespace runners (https://namespace.so): Linux on the owner's
# `gitrunner` profile (amd64, with a cache volume) and macOS on an inline
# label with a cache volume, which `nscloud-cache-action` fills. Windows
# stays on GitHub's runner because the Namespace plan has no Windows.

jobs:
  fmt:
    name: rustfmt
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    # Windows on GitHub's runner has taken up to 39 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: namespace-profile-gitrunner
          - os: macos
            runner: [nscloud-macos-tahoe-arm64-6x14-with-cache, nscloud-cache-tag-voxelcraft-ci-macos]
          - os: windows
            # The Namespace plan doesn't allow Windows instances (checked 2026-11-06).
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux audio/windowing headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libfontconfig1-dev libfreetype6-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: runner.os != 'Windows'
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
      - name: Headless generation/meshing benchmark
        run: cargo run --release --locked -- --bench --rd 4
      # The release binary from the benchmark step checks its embedded asset manifest.
      - name: Validate assets
        if: runner.os == 'Linux'
        run: python3 tools/validate_assets.py --executable target/release/voxelcraft
      - name: Benchmark gate tool tests
        if: runner.os == 'Linux'
        run: python3 -m unittest tools/test_benchmark_scenes.py
      - name: Documentation links
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest tools/test_check_doc_links.py
          python3 tools/check_doc_links.py

  headless:
    name: simulation without client dependencies
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - run: cargo clippy --release --no-default-features --all-targets --locked -- -D warnings
      - run: cargo test --release --no-default-features --locked
      - run: cargo run --release --no-default-features --locked --example headless
