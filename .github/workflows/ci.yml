name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Jobs run on Namespace runners (https://namespace.so): Linux on the owner's
# `gitrunner` profile (amd64, with a cache volume), macOS and Windows on
# inline labels with a per-platform cache volume. `nscloud-cache-action`
# keeps the cargo registry and build output on those volumes.

jobs:
  fmt:
    name: rustfmt
    runs-on: namespace-profile-gitrunner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: namespace-profile-gitrunner
          - os: macos
            runner: [nscloud-macos-tahoe-arm64-6x14-with-cache, nscloud-cache-tag-voxelcraft-ci-macos]
          - os: windows
            runner: [nscloud-windows-2022-amd64-8x16-with-cache, nscloud-cache-tag-voxelcraft-ci-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio/windowing headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - name: Headless generation/meshing benchmark
        run: cargo run --release -- --bench --rd 4

  headless:
    name: simulation without client dependencies
    runs-on: namespace-profile-gitrunner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - run: cargo clippy --release --no-default-features --all-targets -- -D warnings
      - run: cargo test --release --no-default-features
      - run: cargo run --release --no-default-features --example headless
